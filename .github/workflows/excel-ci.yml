name: Excel CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-excel:
    name: Validate workbooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate Excel workbooks
        run: python scripts/validate_workbooks.py

      - name: Upload workbook inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbook-inventory
          path: workbook-inventory.json
          if-no-files-found: ignore
